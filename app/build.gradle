apply plugin: 'com.android.application'

android {
    namespace "com.hobbyone.HashDroid"
    compileSdk 34

    defaultConfig {
        applicationId "com.hobbyone.HashDroid"
        minSdkVersion 19
        targetSdkVersion 34
        versionCode 25
        versionName "4.4"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
